[project]
name = "aitestproject"
version = "0.1.0"
description = "AI 测试平台 - 基于 FastAPI + Vue3 的智能测试用例生成平台"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "AI Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
]

# ========================================
# 生产依赖
# ========================================
dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "gunicorn>=23.0.0",
    "requests>=2.32.0",
    "rsa>=4.9",
    "uvicorn[standard]>=0.32.0",
    # 数据验证
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # 数据库
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1,<1.2.0",
    "alembic>=1.14.0",
    # 被测库多类型直连驱动（数据库能力中心：测连接/内省/SQL 执行）——均为纯 wheel、免系统依赖
    "psycopg2-binary>=2.9",   # PostgreSQL
    "oracledb>=2.0",          # Oracle（thin 模式，纯 Python，免 Instant Client）
    "pymssql>=2.3",           # SQL Server（自带 FreeTDS wheel，免系统 ODBC 驱动）
    "pymongo>=4.6",           # MongoDB
    # 任务队列
    "celery>=5.4.0",
    "flower>=2.0.1",
    # 认证
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    # 工具
    "httpx>=0.28.0",
    "python-dotenv>=1.0.1",
    "aiomysql>=0.3.2",
    "captcha==0.5",
    "bcrypt>=5.0.0",
    "argon2-cffi>=25.1.0",
    "langchain>=1.2.12",
    "langchain-openai>=1.1.11",
    "langchain-deepseek>=1.0.1",
    "faker>=40.11.0",
    "retry>=0.9.2",
    "sse-starlette>=3.3.2",
    "jinja2>=3.1.6",
    "pymupdf>=1.27.2.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.0",
    "pycryptodome>=3.23.0",
    "cos-python-sdk-v5>=1.9.42",
    "redis>=8.0.0",
    "mammoth>=1.12.0",
    "ollama>=0.6.2",
    "celery-types>=0.26.0",
    "croniter>=6.2.2",
    # —— 生产运行时【直接被 app/ import】但原先只手动装在本地 .venv、未写进清单的依赖 ——
    #    （部署 `uv sync --frozen --no-dev` 会因缺失它们导致后端 import 即崩；已用 importlib.metadata 核定）
    "aiosqlite>=0.22.1",                   # app/ai_core/chat_agent：AsyncSqliteSaver 对话检查点
    "langgraph-checkpoint-sqlite>=3.1.0",  # langgraph.checkpoint.sqlite.aio.AsyncSqliteSaver
    "langchain-text-splitters>=1.1.2",     # app/services/knowledge：文本切分
    "numpy>=2.0",
]

# ========================================
# 开发依赖
# ========================================
[project.optional-dependencies]
dev = [
    # 代码格式化
    "black>=24.10.0",
    "isort>=5.13.2",

    # 代码检查
    "flake8>=7.1.1",
    "flake8-isort>=6.1.1",
    "pydocstyle>=6.3.0",

    # 类型检查
    "mypy>=1.14.1",
    "types-requests>=2.32.0",

    # 测试
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",

    # 文档
    "interrogate>=1.5.0",

    # 安全检查
    "bandit[toml]>=1.8.3",

    # Pre-commit 钩子
    "pre-commit>=4.0.1",

    # 开发工具
    "ipython>=8.31.0",
    "rich>=13.9.4",
]

# ========================================
# UV 工具配置
# ========================================
[tool.uv]
dev-dependencies = [
    "black>=24.10.0",
    "isort>=5.13.2",
    "flake8>=7.1.1",
    "flake8-isort>=6.1.1",
    "pydocstyle>=6.3.0",
    "mypy>=1.14.1",
    "types-requests>=2.32.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "interrogate>=1.5.0",
    "bandit[toml]>=1.8.3",
    "pre-commit>=4.0.1",
    "ipython>=8.31.0",
    "rich>=13.9.4",
]

# ========================================
# Black 配置
# ========================================
[tool.black]
line-length = 88
target-version = ["py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | venv
    | env
    | build
    | dist
    | \.egg-info
)/
'''

# ========================================
# isort 配置
# ========================================
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
]
known_third_party = [
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "sqlalchemy",
    "alembic",
    "celery",
    "pytest",
    "httpx",
]

# ========================================
# Mypy 配置
# ========================================
[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
show_column_numbers = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = [
    '\.git',
    '__pycache__',
    '\.venv',
    'venv',
    'env',
    'build',
    'dist',
    '.*\.egg-info',
    'tests',
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "flower.*",
]
ignore_missing_imports = true

# ========================================
# Pytest 配置
# ========================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--asyncio-mode=auto",
]
markers = [
    "slow: 慢速测试",
    "integration: 集成测试",
    "unit: 单元测试",
]
asyncio_mode = "auto"

# ========================================
# Coverage 配置
# ========================================
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ========================================
# Bandit 配置（安全检查）
# ========================================
[tool.bandit]
exclude_dirs = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "tests",
]
skips = [
    "B101",  # 允许 assert 用于开发调试
    "B601",  # 参数化 SQL 已由 ORM 处理
]

# ========================================
# Interrogate 配置（文档覆盖率）
# ========================================
[tool.interrogate]
fail-under = 80
exclude = [
    "tests/",
    ".venv/",
    "venv/",
    "env/",
    "build/",
    "dist/",
    ".git/",
]
ignore-init-method = true
ignore-init-module = false
ignore-magic = false
ignore-semicolon = true
ignore-private = true
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = false
ignore-overloaded-functions = true
verbose = 0
quiet = false
color = true
omit-covered-files = false
