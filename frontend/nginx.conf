# ===== AI 智能测试平台 —— nginx 站点配置 =====
# 由 frontend/Dockerfile 以 COPY 烘焙到 /etc/nginx/conf.d/default.conf。
# （不用 RUN heredoc：docker classic builder 下 heredoc 的 stdin 为空、会写出空配置。）

# WebSocket 升级头按需切换：仅当请求带 Upgrade 头才下发 Connection: upgrade，
# 普通 REST/SSE 请求下发 Connection: close，避免无条件 upgrade 干扰 keep-alive。
# （map 必须在 http 上下文；conf.d/*.conf 被 include 进 http{} 内，故此处合法。）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # 与后端 MAX_UPLOAD_SIZE=100 对齐，否则大附件上传 413。
    client_max_body_size 100m;

    # ---- nginx 自身健康检查（compose healthcheck: wget /healthz）----
    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- 反代 API：WebSocket 升级 + SSE 关缓冲 + 长任务超时 ----
    # WebSocket：chat /api/v1/.../chat/ws/*
    # SSE：execute_suite_sse 内联执行（必须关 proxy_buffering）
    # 3600s：匹配 AI 任务 AI_TASK_TIME_LIMIT
    location /api/ {
        proxy_pass http://backend-api:8888;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---- 附件 / 头像静态访问（后端返回 /uploads URL）----
    location /uploads/ {
        proxy_pass http://backend-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Web 自动化截图静态访问（后端 api.py 挂载，依赖 web-results 卷持久化）----
    location /web-screenshots/ {
        proxy_pass http://backend-api:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- SPA：history 模式兜底，漏配则刷新子路由 404 ----
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

