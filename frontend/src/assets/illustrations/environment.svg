<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="ev-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="ev-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <radialGradient id="ev-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B96B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00B96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="ev-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 辉光 -->
  <circle cx="240" cy="180" r="200" fill="url(#ev-glow)"/>

  <!-- 装饰 -->
  <circle cx="70" cy="92" r="6" fill="#00B96B" opacity="0.3"/>
  <circle cx="416" cy="96" r="8" fill="#00B96B" opacity="0.22"/>
  <circle cx="62" cy="282" r="5" fill="#00B96B" opacity="0.3"/>
  <circle cx="424" cy="270" r="7" fill="#00B96B" opacity="0.25"/>
  <g fill="#5DDE9C" opacity="0.7">
    <path d="M388 150 L390 156 L396 158 L390 160 L388 166 L386 160 L380 158 L386 156 Z"/>
    <path d="M96 150 L98 156 L104 158 L98 160 L96 166 L94 160 L88 158 L94 156 Z"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="240" cy="322" rx="124" ry="14" fill="#00B96B" opacity="0.12"/>

  <!-- 云朵 -->
  <g transform="translate(240, 78)" filter="url(#ev-shadow)">
    <path d="M-52 16 a20 20 0 0 1 6-39 a26 26 0 0 1 50-9 a22 22 0 0 1 30 20 a16 16 0 0 1 -4 28 Z"
          fill="url(#ev-paper)" stroke="#00B96B" stroke-opacity="0.3" stroke-width="2"/>
  </g>

  <!-- 云到服务器的连接虚线 -->
  <line x1="240" y1="100" x2="240" y2="140" stroke="#00B96B" stroke-width="2.5"
        stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"/>

  <!-- 服务器机架（两层） -->
  <g transform="translate(240, 216)" filter="url(#ev-shadow)">
    <rect x="-88" y="-72" width="176" height="60" rx="10" fill="url(#ev-paper)" stroke="#00B96B" stroke-opacity="0.25"/>
    <circle cx="-64" cy="-42" r="6" fill="url(#ev-green)"/>
    <circle cx="-42" cy="-42" r="6" fill="#94E9BD"/>
    <circle cx="-20" cy="-42" r="6" fill="#E5E7EB"/>
    <rect x="14" y="-50" width="58" height="5" rx="2.5" fill="#E5E7EB"/>
    <rect x="14" y="-39" width="58" height="5" rx="2.5" fill="#E5E7EB"/>

    <rect x="-88" y="-4" width="176" height="60" rx="10" fill="url(#ev-paper)" stroke="#00B96B" stroke-opacity="0.25"/>
    <circle cx="-64" cy="26" r="6" fill="url(#ev-green)"/>
    <circle cx="-42" cy="26" r="6" fill="url(#ev-green)" opacity="0.5"/>
    <circle cx="-20" cy="26" r="6" fill="#E5E7EB"/>
    <rect x="14" y="18" width="58" height="5" rx="2.5" fill="#E5E7EB"/>
    <rect x="14" y="29" width="58" height="5" rx="2.5" fill="#E5E7EB"/>
  </g>

  <!-- 前景齿轮 -->
  <g transform="translate(348, 286)" filter="url(#ev-shadow)">
    <g fill="url(#ev-paper)" stroke="#00B96B" stroke-opacity="0.45" stroke-width="2">
      <g>
        <rect x="-5" y="-34" width="10" height="13" rx="3.5"/>
        <rect x="-5" y="21" width="10" height="13" rx="3.5"/>
        <rect x="-34" y="-5" width="13" height="10" rx="3.5"/>
        <rect x="21" y="-5" width="13" height="10" rx="3.5"/>
        <rect x="-5" y="-34" width="10" height="13" rx="3.5" transform="rotate(45)"/>
        <rect x="-5" y="21" width="10" height="13" rx="3.5" transform="rotate(45)"/>
        <rect x="-34" y="-5" width="13" height="10" rx="3.5" transform="rotate(45)"/>
        <rect x="21" y="-5" width="13" height="10" rx="3.5" transform="rotate(45)"/>
      </g>
      <circle r="25"/>
    </g>
    <circle r="9" fill="#FFFFFF" stroke="#00B96B" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- 漂浮小卡：数据库圆柱 -->
  <g transform="translate(96, 168) rotate(-10)" filter="url(#ev-shadow)">
    <rect width="62" height="64" rx="8" fill="#FFFFFF"/>
    <g transform="translate(31, 18)">
      <ellipse cx="0" cy="0" rx="16" ry="6" fill="url(#ev-green)"/>
      <path d="M-16 0 V22 A16 6 0 0 0 16 22 V0" fill="#94E9BD"/>
      <ellipse cx="0" cy="11" rx="16" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
      <ellipse cx="0" cy="22" rx="16" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    </g>
  </g>
</svg>
