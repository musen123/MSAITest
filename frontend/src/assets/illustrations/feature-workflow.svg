<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8FBF1"/>
      <stop offset="100%" stop-color="#C9F4DD"/>
    </linearGradient>
    <linearGradient id="wfNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <linearGradient id="wfCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36D399"/>
      <stop offset="100%" stop-color="#00A05E"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect width="480" height="360" rx="24" fill="url(#wfBg)"/>

  <!-- 装饰光斑 -->
  <circle cx="60" cy="60" r="30" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="420" cy="320" r="40" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="400" cy="60" r="14" fill="#00B96B" opacity="0.15"/>

  <!-- 中央节点（带阴影的圆形） -->
  <circle cx="240" cy="180" r="58" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="240" cy="180" r="46" fill="url(#wfCenter)" stroke="#FFFFFF" stroke-width="4"/>
  <!-- 中央齿轮图标 -->
  <circle cx="240" cy="180" r="14" fill="#FFFFFF"/>
  <circle cx="240" cy="180" r="5" fill="#00A05E"/>
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <line x1="240" y1="160" x2="240" y2="166"/>
    <line x1="240" y1="194" x2="240" y2="200"/>
    <line x1="220" y1="180" x2="226" y2="180"/>
    <line x1="254" y1="180" x2="260" y2="180"/>
    <line x1="226" y1="166" x2="230" y2="170"/>
    <line x1="250" y1="190" x2="254" y2="194"/>
    <line x1="226" y1="194" x2="230" y2="190"/>
    <line x1="250" y1="170" x2="254" y2="166"/>
  </g>

  <!-- 连线（中央 → 四角子节点） -->
  <g stroke="#00B96B" stroke-width="2.5" stroke-dasharray="6 5" stroke-linecap="round" opacity="0.7">
    <line x1="240" y1="180" x2="100" y2="90"/>
    <line x1="240" y1="180" x2="380" y2="90"/>
    <line x1="240" y1="180" x2="100" y2="270"/>
    <line x1="240" y1="180" x2="380" y2="270"/>
  </g>

  <!-- 4 个子节点（左上：触发器，右上：API，右下：DB，左下：UI） -->
  <!-- 左上：触发器（时钟图标） -->
  <rect x="62" y="52" width="76" height="76" rx="16" fill="#FFFFFF" stroke="#00B96B" stroke-width="2"/>
  <circle cx="100" cy="90" r="22" fill="url(#wfNode)"/>
  <circle cx="100" cy="90" r="17" fill="#FFFFFF"/>
  <line x1="100" y1="90" x2="100" y2="80" stroke="#00A05E" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="90" x2="107" y2="93" stroke="#00A05E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="90" r="1.5" fill="#00A05E"/>

  <!-- 右上：API 调用 -->
  <rect x="342" y="52" width="76" height="76" rx="16" fill="#FFFFFF" stroke="#00B96B" stroke-width="2"/>
  <circle cx="380" cy="90" r="22" fill="url(#wfNode)"/>
  <text x="380" y="97" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, monospace" font-weight="700" font-size="14">API</text>

  <!-- 左下：UI 自动化 -->
  <rect x="62" y="232" width="76" height="76" rx="16" fill="#FFFFFF" stroke="#00B96B" stroke-width="2"/>
  <circle cx="100" cy="270" r="22" fill="url(#wfNode)"/>
  <rect x="91" y="262" width="18" height="14" rx="2" fill="#FFFFFF"/>
  <line x1="91" y1="266" x2="109" y2="266" stroke="#00A05E" stroke-width="1"/>
  <line x1="91" y1="269" x2="104" y2="269" stroke="#00A05E" stroke-width="1"/>
  <line x1="91" y1="272" x2="106" y2="272" stroke="#00A05E" stroke-width="1"/>
  <line x1="96" y1="259" x2="104" y2="259" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 右下：数据库 -->
  <rect x="342" y="232" width="76" height="76" rx="16" fill="#FFFFFF" stroke="#00B96B" stroke-width="2"/>
  <circle cx="380" cy="270" r="22" fill="url(#wfNode)"/>
  <ellipse cx="380" cy="262" rx="11" ry="3.5" fill="#FFFFFF"/>
  <path d="M369 262 L369 278 C369 280 374 282 380 282 C386 282 391 280 391 278 L391 262" fill="#FFFFFF"/>
  <path d="M369 270 C369 272 374 274 380 274 C386 274 391 272 391 270" stroke="#00A05E" stroke-width="1" fill="none"/>

  <!-- 浮动小图标：拖拽手柄 / AI 火花 -->
  <g transform="translate(180, 110)">
    <rect x="0" y="0" width="40" height="22" rx="6" fill="#FFFFFF" stroke="#00B96B" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="12" cy="11" r="1.5" fill="#00A05E"/>
    <circle cx="20" cy="11" r="1.5" fill="#00A05E"/>
    <circle cx="28" cy="11" r="1.5" fill="#00A05E"/>
  </g>
  <g transform="translate(280, 230)">
    <rect x="0" y="0" width="40" height="22" rx="6" fill="#FFFFFF" stroke="#00B96B" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="12" cy="11" r="1.5" fill="#00A05E"/>
    <circle cx="20" cy="11" r="1.5" fill="#00A05E"/>
    <circle cx="28" cy="11" r="1.5" fill="#00A05E"/>
  </g>

  <!-- AI 火花标识 -->
  <g transform="translate(390, 140)">
    <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
  </g>
  <g transform="translate(90, 180)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
  </g>
</svg>