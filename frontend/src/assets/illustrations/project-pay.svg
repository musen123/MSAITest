<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="pp2-card-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="pp2-card-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- 装饰 -->
  <circle cx="14" cy="20" r="3" fill="#7C3AED" opacity="0.3"/>
  <circle cx="82" cy="80" r="3" fill="#3B82F6" opacity="0.3"/>
  <!-- 货币符号背景 -->
  <text x="48" y="86" font-family="Arial Black" font-weight="900" font-size="40" fill="#7C3AED" text-anchor="middle" opacity="0.08">¥</text>
  <!-- 后卡 -->
  <g transform="translate(20, 30) rotate(-10 28 18)">
    <rect x="0" y="0" width="56" height="36" rx="5" fill="url(#pp2-card-back)"/>
    <rect x="6" y="22" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
    <rect x="6" y="27" width="14" height="2" rx="1" fill="#FFFFFF" opacity="0.5"/>
  </g>
  <!-- 前卡 -->
  <g transform="translate(22, 30)">
    <rect x="0" y="0" width="56" height="36" rx="5" fill="url(#pp2-card-front)"/>
    <!-- 芯片 -->
    <rect x="6" y="8" width="10" height="8" rx="1.5" fill="#FCD34D"/>
    <line x1="6" y1="11" x2="16" y2="11" stroke="#F59E0B" stroke-width="0.5"/>
    <line x1="6" y1="13" x2="16" y2="13" stroke="#F59E0B" stroke-width="0.5"/>
    <line x1="11" y1="8" x2="11" y2="16" stroke="#F59E0B" stroke-width="0.5"/>
    <!-- 波浪 -->
    <path d="M22 12 Q26 8 30 12 T38 12 T46 12" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.9"/>
    <!-- 卡号占位 -->
    <g fill="#FFFFFF">
      <circle cx="8" cy="28" r="1.5"/>
      <circle cx="12" cy="28" r="1.5"/>
      <circle cx="16" cy="28" r="1.5"/>
      <circle cx="20" cy="28" r="1.5"/>
      <circle cx="28" cy="28" r="1.5"/>
      <circle cx="32" cy="28" r="1.5"/>
      <circle cx="36" cy="28" r="1.5"/>
      <circle cx="40" cy="28" r="1.5"/>
      <text x="46" y="31" font-family="monospace" font-weight="700" font-size="6" fill="#FFFFFF">1234</text>
    </g>
  </g>
  <!-- 闪光 -->
  <path d="M66 14 L67 17 L70 18 L67 19 L66 22 L65 19 L62 18 L65 17 Z" fill="#FCD34D" opacity="0.8"/>
  <path d="M14 70 L15 72 L17 73 L15 74 L14 76 L13 74 L11 73 L13 72 Z" fill="#FCD34D" opacity="0.7"/>
