<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="ac-bot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <linearGradient id="ac-bubble-ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <linearGradient id="ac-bubble-user" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>
    <radialGradient id="ac-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B96B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00B96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="ac-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 辉光 -->
  <circle cx="240" cy="180" r="200" fill="url(#ac-glow)"/>

  <!-- 装饰 -->
  <circle cx="70" cy="80" r="6" fill="#00B96B" opacity="0.3"/>
  <circle cx="410" cy="90" r="8" fill="#00B96B" opacity="0.22"/>
  <circle cx="60" cy="280" r="5" fill="#00B96B" opacity="0.3"/>
  <circle cx="420" cy="280" r="7" fill="#00B96B" opacity="0.25"/>
  <g fill="#5DDE9C" opacity="0.7">
    <path d="M380 50 L382 56 L388 58 L382 60 L380 66 L378 60 L372 58 L378 56 Z"/>
    <path d="M120 230 L122 236 L128 238 L122 240 L120 246 L118 240 L112 238 L118 236 Z"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="240" cy="320" rx="160" ry="14" fill="#00B96B" opacity="0.1"/>

  <!-- ============ 左侧 AI 机器人 ============ -->
  <g transform="translate(140, 200)" filter="url(#ac-shadow)">
    <!-- 天线 -->
    <line x1="0" y1="-58" x2="0" y2="-70" stroke="#00A05E" stroke-width="3"/>
    <circle cx="0" cy="-72" r="5" fill="#10B981"/>
    <circle cx="0" cy="-72" r="2" fill="#FFFFFF" opacity="0.8"/>

    <!-- 身体 -->
    <rect x="-25" y="-5" width="50" height="50" rx="10" fill="url(#ac-bot)"/>
    <rect x="-22" y="-2" width="4" height="40" rx="2" fill="#FFFFFF" opacity="0.3"/>

    <!-- 头 -->
    <ellipse cx="0" cy="-32" rx="32" ry="30" fill="url(#ac-bot)"/>
    <ellipse cx="-16" cy="-48" rx="10" ry="8" fill="#FFFFFF" opacity="0.35"/>

    <!-- 眼睛 -->
    <circle cx="-12" cy="-34" r="8" fill="#1F2937"/>
    <circle cx="12" cy="-34" r="8" fill="#1F2937"/>
    <circle cx="-10" cy="-37" r="3" fill="#FFFFFF"/>
    <circle cx="14" cy="-37" r="3" fill="#FFFFFF"/>

    <!-- 嘴 (微笑) -->
    <path d="M-7 -22 Q0 -16 7 -22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- 腮红 -->
    <ellipse cx="-22" cy="-26" rx="5" ry="3" fill="#FBBF24" opacity="0.5"/>
    <ellipse cx="22" cy="-26" rx="5" ry="3" fill="#FBBF24" opacity="0.5"/>

    <!-- 耳 -->
    <rect x="-38" y="-38" width="6" height="14" rx="3" fill="url(#ac-bot)"/>
    <rect x="32" y="-38" width="6" height="14" rx="3" fill="url(#ac-bot)"/>

    <!-- 屏幕（胸前） -->
    <rect x="-18" y="6" width="36" height="22" rx="4" fill="#1F2937"/>
    <g stroke="#5DDE9C" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M-12 18 L-7 14 L-2 22 L3 10 L8 20 L12 16"/>
    </g>

    <!-- 底座 -->
    <ellipse cx="0" cy="46" rx="28" ry="4" fill="#008550"/>
  </g>

  <!-- ============ AI 对话气泡 (左) ============ -->
  <g transform="translate(195, 110)" filter="url(#ac-shadow)">
    <path d="M0 0 L150 0 Q160 0 160 10 L160 38 Q160 48 150 48 L20 48 L8 60 L8 48 L0 48 Q-10 48 -10 38 L-10 10 Q-10 0 0 0 Z"
          fill="url(#ac-bubble-ai)"/>
    <!-- AI 火花标识 -->
    <g transform="translate(14, 18)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FFFFFF"/>
    </g>
    <!-- 内容 -->
    <rect x="30" y="14" width="100" height="3" rx="1.5" fill="#FFFFFF" opacity="0.95"/>
    <rect x="30" y="22" width="116" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="30" y="30" width="80" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
    <!-- "AI" 角标 -->
    <text x="148" y="11" font-size="6" font-weight="800" fill="#FFFFFF" text-anchor="end" opacity="0.7">AI Assistant</text>
  </g>

  <!-- ============ 用户对话气泡 (右) ============ -->
  <g transform="translate(310, 180)" filter="url(#ac-shadow)">
    <path d="M0 0 L140 0 Q150 0 150 10 L150 30 Q150 40 140 40 L150 52 L132 40 L0 40 Q-10 40 -10 30 L-10 10 Q-10 0 0 0 Z"
          fill="url(#ac-bubble-user)" stroke="#00B96B" stroke-opacity="0.3"/>
    <rect x="10" y="12" width="120" height="3" rx="1.5" fill="#374151"/>
    <rect x="10" y="20" width="100" height="3" rx="1.5" fill="#374151" opacity="0.8"/>
    <rect x="10" y="28" width="80" height="3" rx="1.5" fill="#9CA3AF"/>
  </g>

  <!-- ============ AI 第二段回复 (右下) ============ -->
  <g transform="translate(195, 250)" filter="url(#ac-shadow)">
    <path d="M0 0 L130 0 Q140 0 140 10 L140 30 Q140 40 130 40 L20 40 L10 52 L10 40 L0 40 Q-10 40 -10 30 L-10 10 Q-10 0 0 0 Z"
          fill="url(#ac-bubble-ai)"/>
    <!-- 输入中... 三点 -->
    <circle cx="20" cy="20" r="3.5" fill="#FFFFFF"/>
    <circle cx="32" cy="20" r="3.5" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="44" cy="20" r="3.5" fill="#FFFFFF" opacity="0.4"/>
    <rect x="60" y="17" width="60" height="3" rx="1.5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="60" y="25" width="40" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- 思维粒子 -->
  <g fill="#5DDE9C" opacity="0.7">
    <circle cx="155" cy="100" r="2"/>
    <circle cx="170" cy="80" r="3"/>
    <circle cx="190" cy="65" r="2"/>
  </g>
  <g fill="#5DDE9C" opacity="0.9">
    <path d="M180 90 L182 96 L188 98 L182 100 L180 106 L178 100 L172 98 L178 96 Z"/>
  </g>
</svg>
