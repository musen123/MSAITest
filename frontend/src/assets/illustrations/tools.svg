<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="tl-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>
    <linearGradient id="tl-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <radialGradient id="tl-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B96B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00B96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="tl-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 辉光 -->
  <circle cx="240" cy="180" r="200" fill="url(#tl-glow)"/>

  <!-- 装饰 -->
  <circle cx="72" cy="86" r="6" fill="#00B96B" opacity="0.3"/>
  <circle cx="412" cy="84" r="8" fill="#00B96B" opacity="0.22"/>
  <circle cx="64" cy="286" r="5" fill="#00B96B" opacity="0.3"/>
  <circle cx="422" cy="276" r="7" fill="#00B96B" opacity="0.25"/>
  <g fill="#5DDE9C" opacity="0.7">
    <path d="M376 56 L378 62 L384 64 L378 66 L376 72 L374 66 L368 64 L374 62 Z"/>
    <path d="M104 232 L106 238 L112 240 L106 242 L104 248 L102 242 L96 240 L102 238 Z"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="240" cy="320" rx="120" ry="14" fill="#00B96B" opacity="0.12"/>

  <!-- 后景螺丝刀 -->
  <g transform="translate(150, 130) rotate(38)" filter="url(#tl-shadow)" opacity="0.75">
    <rect x="-7" y="-86" width="14" height="60" rx="6" fill="#94E9BD"/>
    <rect x="-10" y="-30" width="20" height="14" rx="4" fill="#C9F4DD"/>
    <rect x="-4" y="-16" width="8" height="74" rx="3" fill="#D1D5DB"/>
    <path d="M-4 58 L4 58 L1.5 74 L-1.5 74 Z" fill="#9CA3AF"/>
  </g>

  <!-- 中央扳手 -->
  <g transform="translate(258, 178) rotate(-36)" filter="url(#tl-shadow)">
    <path d="M -16 -74 A 27 27 0 1 0 16 -74"
          stroke="url(#tl-green)" stroke-width="17" stroke-linecap="round"/>
    <rect x="-9" y="-58" width="18" height="128" rx="9" fill="url(#tl-green)"/>
    <circle cx="0" cy="62" r="5" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- 大齿轮 -->
  <g transform="translate(330, 252)" filter="url(#tl-shadow)">
    <g fill="url(#tl-paper)" stroke="#00B96B" stroke-opacity="0.45" stroke-width="2">
      <g>
        <rect x="-6" y="-46" width="12" height="16" rx="4"/>
        <rect x="-6" y="30" width="12" height="16" rx="4"/>
        <rect x="-46" y="-6" width="16" height="12" rx="4"/>
        <rect x="30" y="-6" width="16" height="12" rx="4"/>
        <rect x="-6" y="-46" width="12" height="16" rx="4" transform="rotate(45)"/>
        <rect x="-6" y="30" width="12" height="16" rx="4" transform="rotate(45)"/>
        <rect x="-46" y="-6" width="16" height="12" rx="4" transform="rotate(45)"/>
        <rect x="30" y="-6" width="16" height="12" rx="4" transform="rotate(45)"/>
      </g>
      <circle r="34"/>
    </g>
    <circle r="13" fill="#FFFFFF" stroke="#00B96B" stroke-opacity="0.45" stroke-width="2"/>
    <circle r="5" fill="#5DDE9C" opacity="0.6"/>
  </g>

  <!-- 漂浮小卡：滑块设置 -->
  <g transform="translate(86, 186) rotate(-10)" filter="url(#tl-shadow)">
    <rect width="64" height="46" rx="8" fill="#FFFFFF"/>
    <line x1="10" y1="15" x2="54" y2="15" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="15" r="5" fill="url(#tl-green)"/>
    <line x1="10" y1="31" x2="54" y2="31" stroke="#E5E7EB" stroke-width="3" stroke-linecap="round"/>
    <circle cx="42" cy="31" r="5" fill="url(#tl-green)"/>
  </g>

  <!-- 漂浮小卡：代码符号 -->
  <g transform="translate(352, 110) rotate(8)" filter="url(#tl-shadow)">
    <rect width="52" height="40" rx="8" fill="#FFFFFF"/>
    <path d="M18 12 L11 20 L18 28" stroke="#00B96B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 12 L41 20 L34 28" stroke="#5DDE9C" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="29" y1="11" x2="23" y2="29" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
