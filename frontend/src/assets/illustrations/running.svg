<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="rn-gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#00B96B"/>
    </linearGradient>
    <linearGradient id="rn-gear2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A05E"/>
      <stop offset="100%" stop-color="#008550"/>
    </linearGradient>
    <linearGradient id="rn-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8FBF1"/>
    </linearGradient>
    <radialGradient id="rn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B96B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00B96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="rn-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 辉光 -->
  <circle cx="240" cy="180" r="200" fill="url(#rn-glow)"/>

  <!-- 装饰 -->
  <circle cx="70" cy="70" r="6" fill="#00B96B" opacity="0.3"/>
  <circle cx="410" cy="90" r="8" fill="#00B96B" opacity="0.22"/>
  <circle cx="60" cy="290" r="5" fill="#00B96B" opacity="0.3"/>
  <circle cx="420" cy="280" r="7" fill="#00B96B" opacity="0.25"/>
  <g fill="#5DDE9C" opacity="0.7">
    <path d="M120 130 L122 137 L129 139 L122 141 L120 148 L118 141 L111 139 L118 137 Z"/>
    <path d="M360 230 L362 237 L369 239 L362 241 L360 248 L358 241 L351 239 L358 237 Z"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="240" cy="320" rx="150" ry="14" fill="#00B96B" opacity="0.1"/>

  <!-- ============ 大齿轮 ============ -->
  <g transform="translate(180, 180)" filter="url(#rn-shadow)">
    <!-- 齿牙 (8个) -->
    <g fill="url(#rn-gear)">
      <rect x="-7" y="-78" width="14" height="22" rx="3"/>
      <rect x="-7" y="56" width="14" height="22" rx="3"/>
      <rect x="-78" y="-7" width="22" height="14" rx="3"/>
      <rect x="56" y="-7" width="22" height="14" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-7" y="-78" width="14" height="22" rx="3"/>
        <rect x="-7" y="56" width="14" height="22" rx="3"/>
        <rect x="-78" y="-7" width="22" height="14" rx="3"/>
        <rect x="56" y="-7" width="22" height="14" rx="3"/>
      </g>
    </g>
    <!-- 主体 -->
    <circle cx="0" cy="0" r="60" fill="url(#rn-gear)"/>
    <!-- 高光 -->
    <path d="M-40 -30 Q-45 -50 -20 -55" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.4"/>
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="32" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="32" fill="#00B96B" opacity="0.08"/>
    <!-- 中心轴 -->
    <circle cx="0" cy="0" r="10" fill="url(#rn-gear2)"/>
    <circle cx="-3" cy="-3" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- ============ 小齿轮 ============ -->
  <g transform="translate(310, 130)" filter="url(#rn-shadow)">
    <g fill="url(#rn-gear2)">
      <rect x="-5" y="-46" width="10" height="14" rx="2"/>
      <rect x="-5" y="32" width="10" height="14" rx="2"/>
      <rect x="-46" y="-5" width="14" height="10" rx="2"/>
      <rect x="32" y="-5" width="14" height="10" rx="2"/>
      <g transform="rotate(45)">
        <rect x="-5" y="-46" width="10" height="14" rx="2"/>
        <rect x="-5" y="32" width="10" height="14" rx="2"/>
        <rect x="-46" y="-5" width="14" height="10" rx="2"/>
        <rect x="32" y="-5" width="14" height="10" rx="2"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="36" fill="url(#rn-gear2)"/>
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="url(#rn-gear)"/>
  </g>

  <!-- ============ 漂浮进度卡 (上) ============ -->
  <g transform="translate(330, 230)" filter="url(#rn-shadow)">
    <rect x="0" y="0" width="120" height="56" rx="10" fill="url(#rn-card)" stroke="#00B96B" stroke-opacity="0.3"/>
    <!-- 头部 -->
    <circle cx="14" cy="14" r="5" fill="#00B96B"/>
    <rect x="24" y="11" width="48" height="6" rx="3" fill="#374151"/>
    <rect x="84" y="11" width="28" height="6" rx="3" fill="#00B96B" opacity="0.15"/>
    <text x="98" y="16" font-size="6" font-weight="700" fill="#00B96B" text-anchor="middle">RUNNING</text>
    <!-- 进度条 -->
    <rect x="10" y="32" width="100" height="6" rx="3" fill="#E5E7EB"/>
    <rect x="10" y="32" width="68" height="6" rx="3" fill="url(#rn-gear)"/>
    <!-- 百分比 -->
    <text x="10" y="48" font-size="8" fill="#9CA3AF">执行中</text>
    <text x="110" y="48" font-size="8" font-weight="700" fill="#00B96B" text-anchor="end">68%</text>
  </g>

  <!-- ============ 用例小卡片漂浮 ============ -->
  <g transform="translate(70, 120) rotate(-6)" filter="url(#rn-shadow)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#rn-card)" stroke="#00B96B" stroke-opacity="0.3"/>
    <circle cx="12" cy="15" r="5" fill="#00B96B"/>
    <path d="M9 15 L11 17 L15 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <rect x="22" y="9" width="40" height="3" rx="1.5" fill="#374151"/>
    <rect x="22" y="16" width="28" height="2" rx="1" fill="#9CA3AF"/>
    <rect x="22" y="21" width="34" height="2" rx="1" fill="#9CA3AF" opacity="0.6"/>
  </g>

  <g transform="translate(50, 230) rotate(8)" filter="url(#rn-shadow)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="url(#rn-card)" stroke="#00B96B" stroke-opacity="0.3"/>
    <circle cx="12" cy="15" r="5" fill="#00B96B"/>
    <path d="M9 15 L11 17 L15 13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <rect x="22" y="9" width="36" height="3" rx="1.5" fill="#374151"/>
    <rect x="22" y="16" width="30" height="2" rx="1" fill="#9CA3AF"/>
  </g>

  <!-- 顶部脉动点 -->
  <g fill="#5DDE9C">
    <circle cx="240" cy="80" r="4" opacity="0.9"/>
    <circle cx="220" cy="90" r="3" opacity="0.6"/>
    <circle cx="260" cy="90" r="3" opacity="0.6"/>
    <circle cx="200" cy="100" r="2" opacity="0.4"/>
    <circle cx="280" cy="100" r="2" opacity="0.4"/>
  </g>

  <!-- 旋转弧线 (动感) -->
  <g stroke="#00B96B" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M120 180 A 60 60 0 0 1 130 130" stroke-dasharray="3 4"/>
    <path d="M250 130 A 60 60 0 0 1 250 230" stroke-dasharray="3 4"/>
  </g>
</svg>
