<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="ep-shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DDE9C"/>
      <stop offset="100%" stop-color="#008550"/>
    </linearGradient>
    <linearGradient id="ep-lock-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ep-lock-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#6B7280"/>
    </linearGradient>
    <radialGradient id="ep-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00B96B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00B96B" stop-opacity="0"/>
    </radialGradient>
    <filter id="ep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 辉光 -->
  <circle cx="240" cy="180" r="200" fill="url(#ep-glow)"/>

  <!-- 装饰 -->
  <circle cx="80" cy="80" r="6" fill="#00B96B" opacity="0.3"/>
  <circle cx="400" cy="90" r="8" fill="#00B96B" opacity="0.2"/>
  <circle cx="70" cy="290" r="5" fill="#00B96B" opacity="0.3"/>
  <circle cx="410" cy="280" r="7" fill="#00B96B" opacity="0.25"/>
  <g fill="#F59E0B" opacity="0.65">
    <path d="M120 130 L122 137 L129 139 L122 141 L120 148 L118 141 L111 139 L118 137 Z"/>
    <path d="M380 230 L382 237 L389 239 L382 241 L380 248 L378 241 L371 239 L378 237 Z"/>
  </g>

  <!-- 落地阴影 -->
  <ellipse cx="240" cy="320" rx="130" ry="14" fill="#00B96B" opacity="0.1"/>

  <!-- 后方文档 (代表受保护内容) -->
  <g transform="translate(150, 110) rotate(-8)" filter="url(#ep-shadow)" opacity="0.85">
    <rect x="0" y="0" width="68" height="84" rx="5" fill="#FFFFFF"/>
    <rect x="10" y="12" width="35" height="4" rx="2" fill="#D1D5DB"/>
    <rect x="10" y="22" width="48" height="3" rx="1.5" fill="#E5E7EB"/>
    <rect x="10" y="30" width="42" height="3" rx="1.5" fill="#E5E7EB"/>
    <rect x="10" y="38" width="48" height="3" rx="1.5" fill="#E5E7EB"/>
    <rect x="10" y="46" width="38" height="3" rx="1.5" fill="#E5E7EB"/>
  </g>
  <g transform="translate(265, 105) rotate(8)" filter="url(#ep-shadow)" opacity="0.85">
    <rect x="0" y="0" width="68" height="84" rx="5" fill="#FFFFFF"/>
    <rect x="10" y="12" width="40" height="4" rx="2" fill="#D1D5DB"/>
    <rect x="10" y="22" width="48" height="3" rx="1.5" fill="#E5E7EB"/>
    <rect x="10" y="30" width="42" height="3" rx="1.5" fill="#E5E7EB"/>
  </g>

  <!-- 中央盾牌 -->
  <g transform="translate(240, 200)" filter="url(#ep-shadow)">
    <!-- 盾牌主体 -->
    <path d="M0 -70 L60 -50 L60 10 Q60 50 0 70 Q-60 50 -60 10 L-60 -50 Z" fill="url(#ep-shield)"/>
    <!-- 盾牌高光 -->
    <path d="M-50 -45 L-50 8 Q-50 35 -20 55 L-15 60 Q-55 42 -55 8 Z" fill="#FFFFFF" opacity="0.25"/>
    <!-- 盾牌内圈 -->
    <path d="M0 -55 L48 -38 L48 8 Q48 42 0 56 Q-48 42 -48 8 L-48 -38 Z" fill="#FFFFFF" opacity="0.18"/>

    <!-- 中央锁 -->
    <g transform="translate(0, 0)">
      <!-- 锁臂 -->
      <path d="M-16 -10 L-16 -28 Q-16 -42 0 -42 Q16 -42 16 -28 L16 -10" stroke="url(#ep-lock-arm)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <!-- 锁身 -->
      <rect x="-24" y="-10" width="48" height="38" rx="6" fill="url(#ep-lock-body)"/>
      <!-- 钥匙孔 -->
      <circle cx="0" cy="6" r="4" fill="#1F2937"/>
      <rect x="-2" y="6" width="4" height="12" fill="#1F2937"/>
      <!-- 锁身高光 -->
      <rect x="-22" y="-8" width="3" height="34" rx="1.5" fill="#FFFFFF" opacity="0.4"/>
    </g>
  </g>

  <!-- 漂浮的小钥匙 -->
  <g transform="translate(370, 160) rotate(20)" filter="url(#ep-shadow)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <rect x="9" y="-2" width="18" height="4" fill="#F59E0B"/>
    <rect x="20" y="0" width="3" height="6" fill="#F59E0B"/>
    <rect x="25" y="0" width="2" height="4" fill="#F59E0B"/>
  </g>

  <!-- 禁止符号 -->
  <g transform="translate(110, 180)" opacity="0.7">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#EF4444" stroke-width="3"/>
    <line x1="-9" y1="-9" x2="9" y2="9" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- "无权限" 字样 -->
  <g transform="translate(240, 305)">
    <text font-family="sans-serif" font-size="13" font-weight="600" fill="#008550" text-anchor="middle" opacity="0.8">Access Denied</text>
  </g>
</svg>
